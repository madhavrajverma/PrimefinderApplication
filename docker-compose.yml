networks:
  primescience:
    driver: bridge

services:

  # AFS FILESYSTEM SERVERS

  s1:
    build:
      context: ./afsfs
      dockerfile: Dockerfile
    container_name: s1
    hostname: s1
    networks: [primescience]
    ports:
      - "50051:50051"
    volumes:
      - ./afsfs/testdata/input:/data/input
      - ./afsfs/testdata/output-s1:/data/output
    command: >
      ./bin/server
      -id s1 -host s1 -port 50051
      -primary=true
      -peers s2=s2:50052,s3=s3:50053
      -inputDir /data/input
      -outputDir /data/output
    restart: "no"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 5s
      timeout: 3s
      retries: 10

  s2:
    build:
      context: ./afsfs
      dockerfile: Dockerfile
    container_name: s2
    hostname: s2
    networks: [primescience]
    ports:
      - "50052:50052"
    volumes:
      - ./afsfs/testdata/input:/data/input
      - ./afsfs/testdata/output-s2:/data/output
    command: >
      ./bin/server
      -id s2 -host s2 -port 50052
      -primary=false
      -peers s1=s1:50051,s3=s3:50053
      -inputDir /data/input
      -outputDir /data/output
    restart: "no"
    depends_on:
      s1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50052"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    build:
      context: ./afsfs
      dockerfile: Dockerfile
    container_name: s3
    hostname: s3
    networks: [primescience]
    ports:
      - "50053:50053"
    volumes:
      - ./afsfs/testdata/input:/data/input
      - ./afsfs/testdata/output-s3:/data/output
    command: >
      ./bin/server
      -id s3 -host s3 -port 50053
      -primary=false
      -peers s1=s1:50051,s2=s2:50052
      -inputDir /data/input
      -outputDir /data/output
    restart: "no"
    depends_on:
      s1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50053"]
      interval: 5s
      timeout: 3s
      retries: 10

  
  # PRIME FINDING WORKERS (8 workers for test5a scaling test)


  worker1:
    build:
      context: .
      dockerfile: primefinder/Dockerfile
    container_name: worker1
    hostname: worker1
    networks: [primescience]
    ports:
      - "6001:6001"
      - "6101:6100"
    command: ./bin/worker -id w1 -port 6001 -snapshotPort 6100
    restart: "no"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6001"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker2:
    build:
      context: .
      dockerfile: primefinder/Dockerfile
