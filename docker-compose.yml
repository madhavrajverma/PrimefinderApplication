    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6001"]
      interval: 5s
      timeout: 3s
      retries: 10

  
  # COORDINATOR


  coordinator:
    build:
      context: .
      dockerfile: primefinder/Dockerfile
    container_name: coordinator
    hostname: coordinator
    networks: [primescience]
    command: >
      ./bin/coordinator
      -afs s1:50051,s2:50052,s3:50053
      -workers worker1:6001,worker2:6001,worker3:6001
      -cacheDir /tmp/coord-cache
      -output primes.txt
    profiles: [run]

 
  # TEST RUNNER

  tester:
    image: golang:1.24-alpine
    container_name: tester
    hostname: tester
    networks: [primescience]
    volumes:
      - ./primefinder:/app
      - ./afsfs:/afsfs
    working_dir: /app
    environment:
      - GOPATH=/go
      - GOCACHE=/tmp/go-cache
    restart: "no"
    profiles: [test]